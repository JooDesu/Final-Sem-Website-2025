<!DOCTYPE html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Helldivers 2 Fan Website</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/ScrollTrigger.min.js"></script>
    <link href="css/About.css" rel="stylesheet">
</head>

<body>
    <header>
        <nav class="navbar navbar-expand-sm navbar-dark bg-dark">
            <div class="container-fluid">
                <a class="navbar-brand">
                    <img id="WhiteLogo" src="Images/Helldiver2WhiteLogo.png" alt="Logo">
                </a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                    data-bs-target="#Helldiver2NavbarMenu">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="Helldiver2NavbarMenu">
                    <ul class="navbar-nav ms-auto">
                        <!-- ms-auto can be used to push the element to right if is from right to left will be ms-right-auto -->
                        <li class="nav-item">
                            <a class="nav-link" href="Home.html">
                                <h1>Home</h1>
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="About.html">
                                <h1>About</h1>
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="Enemies.html">
                                <h1>Enemies</h1>
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="Report.html">
                                <h1>Report Bug</h1>
                            </a>
                        </li>
                        <li class="nav-item">
                            <img src="images/Play Button.png" id="button"></img>

                            <audio id="HelldiverMusic">
                                <source src="Music/Aboutmusic.mp3" type="audio/mp3">
                            </audio>
                            <script>
                                var music = document.getElementById("HelldiverMusic");
                                var button = document.getElementById("button");

                                button.onclick = function () {
                                    if (HelldiverMusic.paused) {
                                        HelldiverMusic.play();
                                        button.src = "images/Pause Button.png";
                                    } else {
                                        HelldiverMusic.pause();
                                        button.src = "images/Play Button.png";
                                    }
                                }
                            </script>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <div id="about">
        <main>
            <section id="HD2picture">
                <div class="container-fluid d-flex justify-content-center mx-auto">
                    <!-- mx is margin-left and right -->
                    <img id="banner" :src="'images/'+bannerSrc" alt="Banner" class="img-fluid">
                </div>
            </section>
            <section id="content" class="container-fluid col-12">
                <div class="contentarea">
                    <div v-for="item in content" :key="item.textId" class="row">
                        <!-- :key main used is to improve the identification to be more accurate if there is any changes made remove/add  -->
                        <template v-if="item.contentfirst">
                            <!-- item.contentfirst main use is to give an identification to identify the order of the content display to be first or not -->
                            <div class="col-lg-12 col-xl-6 p-4">
                                <div :id="item.textId">
                                    <h2>{{ item.title }}</h2>
                                    <h3 class="pre-line">{{ item.desc}}</h3>
                                    <h4>{{ item.warning }}</h4>
                                </div>
                            </div>
                            <div class="col-lg-12 col-xl-6">
                                <img :id="item.imgId" :src="'images/'+item.imgSrc" :alt="item.imgAlt" class="img-fluid p-3">
                            </div>
                        </template>

                        <template v-else>
                            <div class="col-lg-12 col-xl-6">
                                <img :id="item.imgId" :src="'images/'+item.imgSrc" :alt="item.imgAlt" class="img-fluid p-3">
                            </div>
                            <div class="col-lg-12 col-xl-6 p-4">
                                <div :id="item.textId">
                                    <h2>{{ item.title }}</h2>
                                    <h3 class="pre-line">{{ item.desc}}</h3>
                                    <h4>{{ item.warning }}</h4>
                                </div>
                            </div>
                        </template>
                    </div>
                </div>
            </section>
        </main>
    </div>
</body>
<footer>
    <div class="container-fluid bg-dark bg-gradiant text-center p-3">
        <h5>Disclaimer This Is An Unofficial Website.</h5>
        <h5>All rights belongs to the officials publisher:Arrowhead Studio and Sony Interactive Entertainment.</h5>
        <h5>If there is any issues feel free to contact me with the following email address: joodesu1234@gmail.com</h5>
    </div>
</footer>
<script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
<script src="js/about.js"></script> 
<script>
    gsap.from("body", { opacity: 0, duration: 1 });

    // Register ScrollTrigger so gsap recognizes scroll-based triggers
    gsap.registerPlugin(ScrollTrigger);

    // Optional: show markers while debugging, set to false for production
    ScrollTrigger.defaults({ markers: false });

    aboutApp.content.forEach((item) => {
        // vueApp.content is used to access the content array in the Vue instance
        // forEach is used to loop through each item in the content array
        gsap.from(`#${item.textId}`, {
            scrollTrigger: {
                trigger: `#${item.textId}`,
                start:"top 90%",
                end:"bottom 10%",
                markers: false,
                toggleActions: "play reverse play reverse"
                // 1.Onenter,2.Onleave,3.Onenterback,4.Onleaveback
            },
            x: -200,
            opacity: 0,
            duration: 2,
        });

        gsap.from(`#${item.imgId}`, {
            scrollTrigger: {
                trigger: `#${item.imgId}`,
                start:"top 90%",
                end:"bottom 10%",
                markers: false,
                toggleActions: "play reverse play reverse"
            },
            x: -200,
            opacity: 0,
            duration: 2,
        });
    });
</script>
